<section class="page-header small">
  <div>
    <p class="eyebrow">Pola niestandardowe</p>
    <h1>Zarządzaj polami dla pacjentów</h1>
  </div>
  <div class="page-actions">
    <button
      class="button button--ghost"
      (click)="router.navigate(['/patients'])"
    >
      Powrót
    </button>
  </div>
</section>

<section class="page-card form-card">
  <h2>Dodaj nowe pole</h2>
  <form class="form" (ngSubmit)="addField()">
    <label>
      Nazwa pola
      <input type="text" [(ngModel)]="name" name="name" required />
    </label>

    <label>
      Klucz pola
      <input type="text" [(ngModel)]="key" name="key" required />
    </label>

    <label>
      Typ pola
      <select [(ngModel)]="type" name="type">
        <option value="text">Tekst</option>
        <option value="number">Liczba</option>
        <option value="date">Data</option>
        <option value="boolean">Tak/Nie</option>
      </select>
    </label>

    <button class="button button--primary" type="submit">Dodaj pole</button>
  </form>
</section>

<section class="page-card list-card">
  <h2>Istniejące pola</h2>
  <div *ngIf="customFields().length; else noFields" class="field-list">
    <article *ngFor="let field of customFields()" class="field-item">
      <div>
        <strong>{{ field.name }}</strong>
        <p>{{ field.key }} • {{ field.type }}</p>
      </div>
      <button class="button button--ghost" (click)="remove(field.id)">
        Usuń
      </button>
    </article>
  </div>
  <ng-template #noFields>
    <p class="hint">
      Nie ma jeszcze żadnych pól. Dodaj pierwsze pole, aby wypełniać je dla
      pacjentów.
    </p>
  </ng-template>
</section>
