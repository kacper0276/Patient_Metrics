<section class="page-header">
  <div>
    <p class="eyebrow">Zalogowany jako</p>
    <h1>Witaj, {{ currentUserName }}!</h1>
  </div>
  <div class="page-actions">
    <button
      class="button button--secondary"
      (click)="router.navigate(['/fields'])"
    >
      Pola niestandardowe
    </button>
    <button
      class="button button--secondary"
      (click)="router.navigate(['/config'])"
    >
      Konfiguracja PDF
    </button>
    <label class="button button--secondary">
      Importuj Excel
      <input
        type="file"
        accept=".xlsx,.xls"
        hidden
        (change)="importExcel($event)"
      />
    </label>
    <button
      class="button button--primary"
      (click)="router.navigate(['/patients/new'])"
    >
      Nowy pacjent
    </button>
  </div>
</section>

<section *ngIf="patients().length; else emptyState" class="grid-list">
  <article *ngFor="let patient of patients()" class="card">
    <div class="card-row">
      <div>
        <h2>{{ patient.firstName }} {{ patient.lastName }}</h2>
        <p class="meta">PESEL: {{ patient.pesel || "brak" }}</p>
      </div>
      <div class="card-actions">
        <button class="button button--ghost" (click)="edit(patient.id)">
          Edytuj
        </button>
        <button class="button button--primary" (click)="downloadPdf(patient)">
          PDF
        </button>
        <button class="button button--ghost" (click)="remove(patient.id)">
          Usuń
        </button>
      </div>
    </div>

    <div class="tags">
      <span *ngFor="let field of customFields()" class="tag">
        <strong>{{ field.name }}:</strong>
        {{ formatValue(patient.customData[field.key]) }}
      </span>
    </div>
  </article>
</section>

<ng-template #emptyState>
  <section class="empty-state">
    <h2>Brak pacjentów</h2>
    <p>
      Dodaj pierwszego pacjenta, aby zobaczyć jego dane oraz wygenerować
      podsumowanie.
    </p>
  </section>
</ng-template>
