<section class="page-card page-card--centered">
  <h1>Logowanie</h1>
  <p>Wprowadź adres e-mail, aby zalogować się do demo.</p>

  <form (ngSubmit)="login()" class="form">
    <label>
      E-mail
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="doctor@patientmetrics.local"
      />
    </label>

    <button type="submit" class="button button--primary">Zaloguj</button>
  </form>

  <p class="hint">
    Użyj e-maila: admin@patientmetrics.local lub doctor@patientmetrics.local
  </p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</section>
